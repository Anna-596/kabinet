<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--sage:#E3E7DE;--green:#1F3A12;--lilac:#C98FD3;--lime:#B6D98C;--ink:#263323;--muted:#7c8778;--white:#fff;--line:#e8ece5;--shadow:0 10px 30px #26332312}
*{box-sizing:border-box}body{margin:0;background:var(--sage);color:var(--ink);font-family:Manrope,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh;max-width:1600px;margin:auto}.sidebar{padding:25px 17px;background:#f8faf6;border-right:1px solid #dce2d8;position:sticky;top:0;height:100vh;overflow:auto}.logo{font-size:29px;font-weight:800;letter-spacing:-2px;padding:8px 12px 22px;color:var(--green)}.logo span{color:var(--lilac)}.profile{background:#eef2e9;border-radius:18px;padding:14px;margin-bottom:20px;font-size:12px}.profile b{display:block;font-size:14px;margin-bottom:3px}.navlabel{font-size:10px;letter-spacing:2px;color:#9aa397;font-weight:800;padding:13px 12px 7px}.nav button{width:100%;text-align:left;background:transparent;padding:11px 12px;border-radius:13px;color:#53604f;font-weight:650;font-size:13px;margin:2px 0;display:flex;gap:10px;align-items:center}.nav button.active,.nav button:hover{background:var(--green);color:white}.nav .ico{width:20px;text-align:center}.sidefoot{font-size:10px;color:#8b9686;padding:18px 10px}.main{padding:28px 34px 60px;min-width:0}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:23px;gap:12px}.crumb{font-size:12px;color:#7d8878}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{background:var(--green);color:white;padding:10px 15px;border-radius:12px;font-weight:700;font-size:12px}.btn.soft{background:#edf1e9;color:var(--green)}.btn.lilac{background:#f3e7f4;color:#774b7d}.btn.tiny{padding:7px 10px;font-size:11px}.hero{border-radius:27px;padding:27px 30px;background:linear-gradient(115deg,#7da65e 0%,#a5bd91 50%,#d6b2d8 100%);color:#20351a;position:relative;overflow:hidden;margin-bottom:20px;min-height:145px}.hero:after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:#ffffff30;right:-55px;top:-110px}.eyebrow{font-size:10px;letter-spacing:2px;font-weight:800;text-transform:uppercase;opacity:.72}.hero h1{font-size:30px;letter-spacing:-1.2px;margin:8px 0 6px}.hero p{margin:0;font-size:13px;max-width:650px}.stats{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}.stat{background:#ffffff80;border:1px solid #ffffff66;border-radius:14px;padding:9px 13px;min-width:105px}.stat b{display:block;font-size:19px}.stat small{font-size:10px;color:#52664b}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{background:var(--white);border-radius:22px;padding:20px;box-shadow:var(--shadow);min-width:0}.card h3{margin:0 0 14px;font-size:15px;letter-spacing:-.3px}.card h4{font-size:12px;margin:14px 0 8px}.muted{color:var(--muted);font-size:12px}.small{font-size:11px;color:var(--muted)}.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-7{grid-column:span 7}.span-6{grid-column:span 6}.span-5{grid-column:span 5}.span-4{grid-column:span 4}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.between{justify-content:space-between}.field{width:100%;border:1px solid var(--line);background:#fbfcfa;border-radius:12px;padding:11px 12px;color:var(--ink);outline:none;font-size:13px}.field:focus{border-color:#9ab78b}.fieldlabel{font-size:11px;font-weight:700;color:#687463;display:block;margin:10px 0 6px}.formrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.item:last-child{border:0}.item .grow{flex:1;min-width:0}.item.done .grow{text-decoration:line-through;color:#9aa397}.check{accent-color:var(--green);width:17px;height:17px}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#edf3e8;color:#526d43;font-size:10px;font-weight:800}.progress{height:8px;border-radius:20px;background:#edf0eb;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#84a96d,#b6d98c);border-radius:20px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 16px}.tabs button{padding:9px 13px;border-radius:12px;background:#f4f6f1;color:#71806b;font-size:11px;font-weight:800}.tabs button.active{background:var(--green);color:white}.hidden{display:none!important}.habitgrid{display:grid;grid-template-columns:160px repeat(7,1fr);gap:5px;align-items:center;font-size:10px}.habitgrid .day{text-align:center;color:#8a9584;font-weight:800}.habitcell{height:25px;border-radius:7px;background:#eff2ec;display:grid;place-items:center;cursor:pointer}.habitcell.on{background:var(--lime);color:#29421d}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.calday{text-align:center;padding:9px 2px;border-radius:12px;background:#f7f9f5;font-size:11px;min-height:48px;cursor:pointer;position:relative}.calday small{display:block;color:#8b9587;font-size:9px}.calday.today{outline:2px solid var(--lilac)}.calday.closed:after{content:"";position:absolute;inset:3px;border:2px solid #7ca35e;border-radius:50%;pointer-events:none}.calday.selected{background:#e6eedf}.timer{font-size:46px;font-weight:800;letter-spacing:-2px;text-align:center;padding:12px}.center{text-align:center}.word{font-size:25px;font-weight:800}.empty{padding:18px;text-align:center;color:#99a294;font-size:12px}.tag{background:#f2e8f4;color:#895b91;border-radius:8px;padding:4px 7px;font-size:10px}.photo{width:100%;height:140px;object-fit:cover;border-radius:15px;background:#eef1eb}.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.photo-tile{min-width:0}.photo-tile img{width:100%;height:110px;object-fit:cover;border-radius:13px}.modalback{position:fixed;inset:0;background:#15200f66;display:grid;place-items:center;padding:18px;z-index:20}.modal{background:white;border-radius:22px;padding:24px;max-width:470px;width:100%;max-height:90vh;overflow:auto}.toast{position:fixed;bottom:25px;right:25px;background:var(--green);color:white;padding:13px 18px;border-radius:14px;z-index:40;font-size:12px;box-shadow:var(--shadow)}.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}.confetti i{position:absolute;top:-20px;width:9px;height:15px;animation:fall 2.5s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.2}}.mobiletitle{display:none}
@media(max-width:900px){.app{display:block}.sidebar{position:fixed;z-index:15;bottom:0;top:auto;height:auto;width:100%;padding:7px 8px calc(7px + env(safe-area-inset-bottom));border:0;border-top:1px solid #dce2d8;overflow-x:auto}.logo,.profile,.navlabel,.sidefoot{display:none}.nav{display:flex;gap:4px;min-width:max-content}.nav button{width:auto;display:flex;flex-direction:column;gap:2px;padding:7px 10px;font-size:9px;margin:0}.nav .ico{font-size:17px}.main{padding:18px 14px 100px}.topbar{margin-bottom:14px}.mobiletitle{display:block;font-weight:800}.hero{padding:22px;border-radius:22px}.hero h1{font-size:25px}.grid{gap:11px}.span-8,.span-7,.span-6,.span-5,.span-4{grid-column:span 12}.card{padding:16px;border-radius:18px}.habitgrid{grid-template-columns:115px repeat(7,1fr);gap:3px}.habitcell{height:22px}.photo-grid{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><div class="app"><aside class="sidebar"><div class="logo">lisa<span>•</span></div><div class="profile"><b>Аня · 20 лет</b>МГУ · Экономический факультет<br>5 семестр · Москва</div><div class="nav" id="nav">
<div class="navlabel">МОЁ ПРОСТРАНСТВО</div>
<button data-page="home" class="active"><span class="ico">⌂</span>Главная</button>
<button data-page="week"><span class="ico">▦</span>Неделя</button>
<button data-page="month"><span class="ico">▣</span>Месяц</button>
<button data-page="habits"><span class="ico">☑</span>Привычки</button>
<div class="navlabel">ТЕЛО И СОСТОЯНИЕ</div>
<button data-page="health"><span class="ico">♡</span>Здоровье</button>
<div class="navlabel">УЧЁБА</div>
<button data-page="study"><span class="ico">✎</span>Учёба</button>
<button data-page="language"><span class="ico">文</span>Английский</button>
<button data-page="books"><span class="ico">▤</span>Книги и цитаты</button>
<button data-page="mind"><span class="ico">✧</span>Память и речь</button>
<div class="navlabel">ТВОРЧЕСТВО И ЖИЗНЬ</div>
<button data-page="content"><span class="ico">▧</span>Контент-план</button>
<button data-page="ideas"><span class="ico">✿</span>Банк идей</button>
<button data-page="craft"><span class="ico">🧶</span>Вязание и схемы</button>
<button data-page="recipes"><span class="ico">♡</span>Рецепты</button>
<button data-page="travel"><span class="ico">✈</span>Путешествия</button>
</div><div class="sidefoot">Тихий прогресс — тоже прогресс ♡<br>Все данные хранятся в этом браузере</div></aside>
<main class="main"><div class="topbar"><div><span class="mobiletitle">lisa • </span><span class="crumb" id="crumb">ТВОЁ ПРОСТРАНСТВО / ГЛАВНАЯ</span></div><div class="actions"><button class="btn soft tiny" onclick="exportData()">↓ Экспорт</button><button class="btn soft tiny" onclick="document.getElementById('importFile').click()">↑ Импорт</button><input id="importFile" type="file" accept="application/json" hidden onchange="importData(event)"></div></div><div id="page"></div></main></div><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s), today=()=>new Date().toISOString().slice(0,10), uid=()=>Math.random().toString(36).slice(2,10);
const defaultData={
profile:{name:"Аня",age:20,uni:"МГУ · Экономический факультет",semester:5},
habits:["Умывание утром","Умывание вечером","Английский 40 минут","Чтение","Тренировка / движение"],
habitLog:{},tasks:[],weekGoals:["Заниматься английским каждый день","Разобрать материалы к семинару"],subjects:["Микроэкономика","Макроэкономика","Эк econometrics","Финансы","Теория игр"],olympiads:[],vocab:[{word:"steady",translation:"устойчивый, стабильный",emoji:"🌱",example:"Make steady progress."},{word:"curious",translation:"любознательный",emoji:"🔎",example:"I am curious about the world."},{word:"gentle",translation:"мягкий, бережный",emoji:"🕊️",example:"Be gentle with yourself."}],focus:[],books:[],quotes:[],ideas:["Связать маленькую сумку из рафии","Приготовить красивый завтрак","Сделать букет из атласных лент"],recipes:[{title:"Сырники с ягодами",note:"Творог, яйцо, мука, щепотка соли. Подать с ягодами и йогуртом."}],craft:[],content:[],photos:[],travel:{goal:50000,saved:0,notes:"Летний отпуск с подругой"},water:0,workouts:["Понедельник · растяжка 20 минут","Среда · full body 25 минут","Суббота · пилатес 30 минут"],cycle:{start:"",length:28,period:5,symptoms:[]},dayLogs:{},monthEvents:{},monthNotes:{},englishText:"I want to learn English. I read a little every day. Small steps help me feel confident.",semester:5
};
let data;try{data=JSON.parse(localStorage.getItem("lisa_anya_v1"))||structuredClone(defaultData)}catch(e){data=structuredClone(defaultData)}
function save(){localStorage.setItem("lisa_anya_v1",JSON.stringify(data))}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(s){let t=$("#toast");t.textContent=s;t.classList.remove("hidden");setTimeout(()=>t.classList.add("hidden"),2200)}
function dateRu(d=today()){return new Date(d+"T12:00:00").toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"})}
function addTask(title,when=today(),period="День",section="Личное"){if(!title.trim())return;data.tasks.push({id:uid(),title:title.trim(),date:when,period,section,done:false});save();render()}
function taskList(filter){let a=data.tasks.filter(filter);return a.length?a.map(t=>`<div class="item ${t.done?"done":""}"><input class="check" type="checkbox" ${t.done?"checked":""} onchange="toggleTask('${t.id}')"><div class="grow"><b>${esc(t.title)}</b><div class="small">${esc(t.period)} · ${esc(t.section)}</div></div><button class="btn soft tiny" onclick="moveTask('${t.id}')">→ завтра</button><button class="btn soft tiny" onclick="editTask('${t.id}')">✎</button><button class="btn soft tiny" onclick="delTask('${t.id}')">×</button></div>`).join(""):'<div class="empty">Пока здесь тихо. Добавь первую маленькую задачу ♡</div>'}
function toggleTask(id){let t=data.tasks.find(x=>x.id===id);t.done=!t.done;save();render()}
function delTask(id){data.tasks=data.tasks.filter(x=>x.id!==id);save();render()}
function moveTask(id){let t=data.tasks.find(x=>x.id===id);let d=new Date(t.date+"T12:00:00");d.setDate(d.getDate()+1);t.date=d.toISOString().slice(0,10);save();render();toast("Перенесла на завтра")}
function editTask(id){let t=data.tasks.find(x=>x.id===id),v=prompt("Измени задачу",t.title);if(v!==null){t.title=v;save();render()}}
function header(title,sub,stats=[]){return `<div class="hero"><div class="eyebrow">LISA · ЛИЧНОЕ ПРОСТРАНСТВО</div><h1>${title}</h1><p>${sub}</p><div class="stats">${stats.map(x=>`<div class="stat"><b>${x[0]}</b><small>${x[1]}</small></div>`).join("")}</div></div>`}
function card(title,body,span="span-6"){return `<section class="card ${span}"><h3>${title}</h3>${body}</section>`}
function field(label,id,placeholder="",value="",type="text"){return `<label class="fieldlabel">${label}</label><input class="field" id="${id}" type="${type}" placeholder="${placeholder}" value="${esc(value)}">`}
function textarea(label,id,placeholder="",value="",rows=3){return `<label class="fieldlabel">${label}</label><textarea class="field" id="${id}" rows="${rows}" placeholder="${placeholder}">${esc(value)}</textarea>`}
function addBtn(label,fn){return `<button class="btn" onclick="${fn}">${label}</button>`}
function go(p){current=p;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));$("#crumb").textContent="ТВОЁ ПРОСТРАНСТВО / "+(labels[p]||p).toUpperCase();render()}
const labels={home:"Главная",week:"Неделя",month:"Месяц",habits:"Привычки",health:"Здоровье",study:"Университет",language:"Английский",books:"Книги и цитаты",mind:"Память, внимание, речь",content:"Контент-план",ideas:"Банк идей",craft:"Вязание и схемы",recipes:"Рецепты",travel:"Путешествия"};
let current="home",timer=null,remaining=25*60,selectedDay=today(),calMonth=new Date().getMonth(),calYear=new Date().getFullYear();
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
function render(){let f=pages[current]||pages.home;$("#page").innerHTML=f()}
const pages={
home:()=>{let d=today(),log=data.dayLogs[d]||{},done=data.tasks.filter(t=>t.date===d&&t.done).length,total=data.tasks.filter(t=>t.date===d).length,mins=data.focus.filter(x=>x.date===d).reduce((a,x)=>a+x.minutes,0),word=data.vocab.length?data.vocab[new Date().getDate()%data.vocab.length]:null;
return header(`Добрый день, ${data.profile.name} ♡`,`${dateRu()} · Не нужно успеть всё. Достаточно сделать следующий маленький шаг.`,[[`${done}/${total}`,"задач сегодня"],[`${mins} мин`,"в фокусе сегодня"],[`${streak()}`,"дней серии привычек"]])+`<div class="grid">
${card("☀ Старт дня",`<div class="formrow"><div><label class="fieldlabel">Энергия · 1–5</label><select class="field" id="energy">${[1,2,3,4,5].map(n=>`<option ${log.energy==n?"selected":""}>${n}</option>`)}</select></div><div><label class="fieldlabel">Настроение · 1–5</label><select class="field" id="mood">${[1,2,3,4,5].map(n=>`<option ${log.mood==n?"selected":""}>${n}</option>`)}</select></div></div>${field("Одно главное дело","mainTask","Например, решить 2 задачи по математике",log.mainTask||"")}<button class="btn" onclick="saveStart()">Сохранить старт</button><p class="small">Если энергия 1–2 — оставь только самое важное. Это полноценный план.</p>`,"span-5")}
${card("✦ Слово дня",word?`<div class="word">${word.emoji} ${esc(word.word)}</div><p>${esc(word.translation)}</p><p class="small">${esc(word.example||"")}</p><button class="btn soft tiny" onclick="speak('${esc(word.word)}')">🔊 Послушать</button> <button class="btn soft tiny" onclick="go('language')">Карточки слов</button>`:"Добавь слова в словарь.","span-4")}
${card("♡ Привычки сегодня",data.habits.map((h,i)=>`<div class="item"><input type="checkbox" class="check" ${data.habitLog[d]?.[i]?"checked":""} onchange="habitToggle(${i},this.checked)"><div class="grow">${esc(h)}</div></div>`).join("")+`<p class="small">Тебе не нужно быть идеальной — отметь то, что получилось.</p>`,"span-3")}
${card("☷ План на сегодня",`<div class="tabs"><button class="active">Сегодня</button><button onclick="go('week')">Неделя →</button></div><div class="small">УТРО</div>${taskList(t=>t.date===d&&t.period==="Утро")}<div class="small">ДЕНЬ</div>${taskList(t=>t.date===d&&t.period==="День")}<div class="small">ВЕЧЕР</div>${taskList(t=>t.date===d&&t.period==="Вечер")}<div class="formrow"><input class="field" id="newTask" placeholder="Маленькая задача…"><select class="field" id="taskPeriod"><option>Утро</option><option selected>День</option><option>Вечер</option></select></div><div class="row" style="margin-top:9px"><select class="field" id="taskSection" style="max-width:180px"><option>Личное</option><option>Английский</option><option>Университет</option><option>Здоровье</option><option>Творчество</option></select><button class="btn" onclick="addTask($('#newTask').value,today(),$('#taskPeriod').value,$('#taskSection').value)">+ Добавить</button></div>`,"span-7")}
${card("◷ Таймер фокуса",`<div class="center"><div class="timer" id="timerDisplay">25:00</div><select class="field" id="focusSection" style="max-width:220px;margin:auto"><option>Английский</option><option>Университет</option><option>Математика ЕГЭ</option><option>Чтение</option><option>Творчество</option><option>Личное</option></select><div class="row" style="justify-content:center;margin:12px"><button class="btn" id="timerBtn" onclick="toggleTimer()">▶ Начать</button><button class="btn soft" onclick="resetTimer()">Сбросить</button></div><div class="small">Время за неделю: ${data.focus.filter(x=>weekKey(x.date)).reduce((a,x)=>a+x.minutes,0)} минут</div></div>`,"span-5")}
${card("🌙 Вечерний итог",`<p class="small">Заметь, что уже получилось. Даже маленькое считается.</p>${field("Одно слово про день","dayWord","Например: тёплый, смелый, насыщенный",log.word||"")}${[0,1,2].map(i=>field(`Что получилось · ${i+1}`,"win"+i,"Любая маленькая победа",log.wins?.[i]||"")).join("")}${textarea("Что перенести на завтра","carry","Без самокритики — просто перенеси важное",log.carry||"",2)}<button class="btn" onclick="closeDay()">Закрыть день ✨</button><p class="small">Закрыть день можно даже с одним выполненным делом.</p>`,"span-7")}
${card("🐈 Маленькая версия",`<p>Если трудно начать, выбери действие на две минуты:</p><div class="item">① Открыть учебник и прочитать один абзац</div><div class="item">② Надеть кроссовки и сделать разминку</div><div class="item">③ Открыть английский текст и выписать одно слово</div><button class="btn soft tiny" onclick="toast('Две минуты — уже начало ♡')">Начать с малого</button>`,"span-5")}

function streak(){let n=0,d=new Date();for(let i=0;i<366;i++){let k=d.toISOString().slice(0,10),v=data.habitLog[k];if(v&&Object.values(v).some(Boolean)){n++;d.setDate(d.getDate()-1)}else break}return n}
function weekKey(d){let dt=new Date(d+"T12:00:00"),now=new Date(today()+"T12:00:00");let a=new Date(now);a.setDate(a.getDate()-(a.getDay()+6)%7);return dt>=a}
function saveStart(){let d=today();data.dayLogs[d]={...(data.dayLogs[d]||{}),energy:+$("#energy").value,mood:+$("#mood").value,mainTask:$("#mainTask").value};save();toast("Старт дня сохранён ♡")}
function closeDay(){let d=today(),old=data.dayLogs[d]||{};data.dayLogs[d]={...old,word:$("#dayWord").value,wins:[0,1,2].map(i=>$("#win"+i).value),carry:$("#carry").value,closed:true};save();confetti();toast("День закрыт. Ты молодец, Аня!");render()}
function confetti(){let c=document.createElement("div");c.className="confetti";for(let i=0;i<65;i++){let e=document.createElement("i");e.style.left=Math.random()*100+"%";e.style.background=["#B6D98C","#C98FD3","#e7c46b","#7da65e"][i%4];e.style.animationDelay=Math.random()+"s";c.append(e)}document.body.append(c);setTimeout(()=>c.remove(),3200)}
function habitToggle(i,v){let d=today();data.habitLog[d]??={};data.habitLog[d][i]=v;save();render()}
function addHabit(){let v=$("#habitName").value.trim();if(v){data.habits.push(v);save();render()}}
function removeHabit(i){data.habits.splice(i,1);save();render()}
function renameHabit(i){let v=prompt("Название привычки",data.habits[i]);if(v){data.habits[i]=v;save();render()}}
function toggleHabitDay(d,i){data.habitLog[d]??={};data.habitLog[d][i]=!data.habitLog[d][i];save();render()}
function addGoal(){let v=$("#goalInput").value.trim();if(v){data.weekGoals.push(v);save();render()}}
function removeGoal(i){data.weekGoals.splice(i,1);save();render()}
function changeMonth(n){calMonth+=n;if(calMonth<0){calMonth=11;calYear--}if(calMonth>11){calMonth=0;calYear++}render()}
function selectDate(d){selectedDay=d;render()}
function saveEvent(){data.monthEvents[selectedDay]=$("#eventTitle").value;save();render()}
function deleteEvent(){delete data.monthEvents[selectedDay];save();render()}
function saveMonthNote(){data.monthNotes[selectedDay]=$("#monthNote").value;save();toast("Заметка сохранена")}
function speak(s){if("speechSynthesis"in window){let u=new SpeechSynthesisUtterance(s);u.lang="en-US";speechSynthesis.speak(u)}else toast("Озвучка не поддерживается этим браузером")}
function resetTimer(){clearInterval(timer);timer=null;remaining=25*60;let e=$("#timerDisplay");if(e)e.textContent="25:00";let b=$("#timerBtn");if(b)b.textContent="▶ Начать"}
function toggleTimer(){if(timer){clearInterval(timer);timer=null;$("#timerBtn").textContent="▶ Продолжить";return}$("#timerBtn").textContent="Ⅱ Пауза";timer=setInterval(()=>{remaining--;let e=$("#timerDisplay");if(e)e.textContent=String(Math.floor(remaining/60)).padStart(2,"0")+":"+String(remaining%60).padStart(2,"0");if(remaining<=0){clearInterval(timer);timer=null;let section=$("#focusSection")?.value||"Личное";data.focus.push({date:today(),minutes:25,section});save();toast("25 минут фокуса завершены!");if(e)e.textContent="00:00";if($("#timerBtn"))$("#timerBtn").textContent="▶ Начать"}},1000)}
function healthTraining(){return `<h3>План тренировок на неделю</h3>${data.workouts.map((x,i)=>`<div class="item"><div class="grow">${esc(x)}</div><button class="btn soft tiny" onclick="removeFrom('workouts',${i})">×</button></div>`).join("")}${field("Новая тренировка","workoutInput","Например, воскресенье · йога 15 минут")}<button class="btn" onclick="addWorkout()">Добавить</button><p class="small">Выбирай нагрузку по самочувствию. Отдых — тоже часть тренировочного плана.</p>`}
function healthTab(tab,b){document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active");let el=$("#healthContent");if(tab==="training")el.innerHTML=healthTraining();if(tab==="cycle"){let c=data.cycle;el.innerHTML=`<div class="card"><h3>Календарь цикла</h3>${field("Первый день последней менструации","cycleStart","",c.start,"date")}<div class="formrow">${field("Средняя длина цикла, дней","cycleLength","28",c.length,"number")}${field("Длительность менструации, дней","periodLength","5",c.period,"number")}</div><button class="btn" onclick="saveCycle()">Сохранить</button><p class="pill">Текущая расчётная фаза: ${phaseNow()}</p><p class="small">Фазы и даты ориентировочные: цикл может меняться, приложение не диагностирует состояния и не заменяет врача.</p>${textarea("Симптомы и самочувствие","symptoms","Например, настроение, боль, сон…")}<button class="btn soft" onclick="saveSymptom()">Сохранить запись</button><div>${c.symptoms.map(s=>`<div class="item">${esc(s.date)} · ${esc(s.text)}</div>`).join("")}</div></div>`}if(tab==="care")el.innerHTML=`<div class="grid"><div class="card span-6"><h3>Вода 💧</h3><div class="word">${data.water} стаканов</div><button class="btn" onclick="data.water++;save();healthTab('care',document.querySelectorAll('.tabs button')[2])">+ Стакан</button> <button class="btn soft" onclick="data.water=Math.max(0,data.water-1);save();healthTab('care',document.querySelectorAll('.tabs button')[2])">−</button><p class="small">Ориентируйся на жажду и рекомендации врача, если они есть.</p></div><div class="card span-6"><h3>Питание</h3><p>Добавляй в рацион разнообразные продукты: овощи и фрукты, источники белка, крупы и полезные жиры. Не нужно привязывать питание к фазе цикла как к строгому правилу.</p></div></div>`}
function phaseNow(){let c=data.cycle;if(!c.start)return"не указана";let n=Math.floor((new Date(today())-new Date(c.start))/86400000)%c.length+1;return n<=c.period?"менструальная":n<c.length*.45?"фолликулярная":n<c.length*.6?"овуляторное окно":"лютеиновая"}
function saveCycle(){data.cycle.start=$("#cycleStart").value;data.cycle.length=Math.max(20,+$("#cycleLength").value||28);data.cycle.period=Math.max(1,+$("#periodLength").value||5);save();go("health")}
function saveSymptom(){let v=$("#symptoms").value.trim();if(v){data.cycle.symptoms.push({date:today(),text:v});save();go("health")}}
function addWorkout(){let v=$("#workoutInput").value.trim();if(v){data.workouts.push(v);save();go("health")}}
function subjectsHTML(){return `<div class="card"><div class="row between"><h3>Предметы семестра</h3><span class="pill">Семестр ${data.semester}</span></div>${field("Номер семестра","semesterNum","5",data.semester,"number")}<button class="btn soft tiny" onclick="setSemester()">Обновить семестр</button><p class="small">Список можно полностью менять при переходе на следующий семестр.</p>${data.subjects.map((s,i)=>`<div class="item"><div class="grow">${esc(s)}</div><button class="btn soft tiny" onclick="editSubject(${i})">Изменить</button><button class="btn soft tiny" onclick="removeSubject(${i})">×</button></div>`).join("")}${field("Новый предмет","subjectInput","Название дисциплины")}<button class="btn" onclick="addSubject()">+ Добавить предмет</button></div>`}
function olympiadHTML(){return `<div class="card"><h3>Университетские олимпиады</h3><p class="small">Отслеживай отборы, регистрацию и результаты — это может пригодиться при поступлении в магистратуру.</p>${field("Название олимпиады","olympTitle","Например, межвузовская олимпиада") }<div class="formrow"><input id="olympDate" type="date" class="field"><select id="olympStatus" class="field"><option>Изучить условия</option><option>Регистрация</option><option>Готовлюсь</option><option>Участвовала</option><option>Результат</option></select></div>${textarea("Ссылка и заметки","olympNote","Сайт, направления, дедлайн…")}<button class="btn" onclick="addOlympiad()">Добавить олимпиаду</button>${data.olympiads.map((o,i)=>`<div class="item"><div class="grow"><b>${esc(o.title)}</b><div class="small">${esc(o.date)} · ${esc(o.status)}<br>${esc(o.note)}</div></div><button class="btn soft tiny" onclick="removeFrom('olympiads',${i})">×</button></div>`).join("")}</div>`}
function studyTab(t,b){document.querySelectorAll("#page .tabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active");$("#studyContent").innerHTML=t==="subjects"?subjectsHTML():t==="olympiads"?olympiadHTML():`<div class="card"><h3>Профильная математика · повторение</h3><p>Небольшая регулярная практика для разминки мозга.</p>${["Алгебра и преобразования","Функции и графики","Уравнения и неравенства","Тригонометрия","Производная и исследование функций","Геометрия","Вероятность и задачи"].map((x,i)=>`<div class="item"><input type="checkbox" class="check"><div class="grow">${x}</div><span class="small">15–25 мин</span></div>`).join("")}${textarea("Задачи на сегодня","mathNote","Какие номера или темы разобрать?")}</div>`}
function setSemester(){data.semester=+$("#semesterNum").value||5;save();toast("Номер семестра обновлён")}
function addSubject(){let v=$("#subjectInput").value.trim();if(v){data.subjects.push(v);save();go("study")}}
function editSubject(i){let v=prompt("Предмет",data.subjects[i]);if(v){data.subjects[i]=v;save();go("study")}}
function removeSubject(i){data.subjects.splice(i,1);save();go("study")}
function addOlympiad(){let title=$("#olympTitle").value.trim();if(title){data.olympiads.push({title,date:$("#olympDate").value,status:$("#olympStatus").value,note:$("#olympNote").value});save();go("study")}}
function languageLesson(){return `<div class="grid"><div class="card span-7"><h3>Вставь английский текст</h3><p class="small">Кабинет создаст упражнения прямо в браузере: пропуски, сборку предложения и список незнакомых слов.</p>${textarea("Текст для изучения","englishInput","Вставь небольшой текст на английском…",data.englishText,7)}<button class="btn" onclick="makeExercises()">Создать задания</button><div id="exerciseArea"></div></div><div class="card span-5"><h3>Ежедневные 40 минут</h3><div class="item">🎧 10 мин · аудирование</div><div class="item">📖 10 мин · чтение</div><div class="item">✍️ 8 мин · письмо</div><div class="item">🗣️ 7 мин · говорение</div><div class="item">🧩 5 мин · грамматика и слова</div><p class="small">Начинай с коротких материалов уровня A1: диалоги, адаптированные истории, простые видео с субтитрами.</p></div></div>`}
function makeExercises(){let text=$("#englishInput").value.trim();if(!text)return toast("Сначала вставь текст");data.englishText=text;save();let words=text.match(/[A-Za-z']{3,}/g)||[],unique=[...new Set(words.map(w=>w.toLowerCase()))],sentences=text.split(/[.!?]+/).map(s=>s.trim()).filter(Boolean),target=words.find(w=>w.length>4)||words[0]||"learn";let blank=text.replace(new RegExp("\\b"+target+"\\b","i"),"_____");let shuffled=[...sentences].sort(()=>Math.random()-.5);$("#exerciseArea").innerHTML=`<div style="margin-top:18px"><h4>1 · Вставь пропущенное слово</h4><p>${esc(blank)}</p><input class="field" id="blankAnswer" placeholder="Какое слово пропущено?"><button class="btn soft tiny" onclick="checkBlank('${esc(target)}')">Проверить</button><div id="blankResult" class="small"></div><h4>2 · Собери текст</h4><p class="small">Поставь предложения в исходном порядке (ориентируйся на смысл):</p><ol>${shuffled.map(s=>`<li>${esc(s)}</li>`).join("")}</ol><h4>3 · Новые слова</h4><p class="small">Добавь незнакомые слова в словарь. Для демонстрации выбраны слова длиннее 4 букв.</p>${unique.filter(w=>w.length>4).slice(0,12).map(w=>`<span class="tag" onclick="addVocab('${w}')">${esc(w)} +</span> `).join("")}</div>`}
function checkBlank(w){let ok=$("#blankAnswer").value.trim().toLowerCase()===w.toLowerCase();$("#blankResult").textContent=ok?"Верно! Отличная работа ♡":"Попробуй ещё раз. Подсказка: "+w[0]+"…"}
function addVocab(w){if(!data.vocab.some(x=>x.word.toLowerCase()===w.toLowerCase()))data.vocab.push({word:w,translation:"Добавь перевод",emoji:"✨",example:""});save();toast("Слово добавлено в словарь")}
function vocabHTML(){return `<div class="grid"><div class="card span-5"><h3>Добавить слово</h3>${field("Слово","vWord","apple")}${field("Перевод","vTrans","яблоко") }<div class="formrow"><input id="vEmoji" class="field" placeholder="Эмодзи 🍎" value="✨"><input id="vExample" class="field" placeholder="Пример предложения"></div><button class="btn" onclick="saveVocab()">Сохранить слово</button><button class="btn soft" onclick="reviewCard()">Карточка для повторения</button><div id="reviewArea"></div></div><div class="card span-7"><h3>Мой словарь</h3>${data.vocab.map((v,i)=>`<div class="item"><div class="grow"><b>${esc(v.emoji)} ${esc(v.word)}</b><div class="small">${esc(v.translation)} · ${esc(v.example)}</div></div><button class="btn soft tiny" onclick="speak('${esc(v.word)}')">🔊</button><button class="btn soft tiny" onclick="removeFrom('vocab',${i})">×</button></div>`).join("")}</div></div>`}
function langTab(t,b){document.querySelectorAll("#page .tabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active");$("#langContent").innerHTML=t==="lesson"?languageLesson():t==="vocab"?vocabHTML():`<div class="card"><h3>Мой ежедневный английский</h3>${["Аудирование · 10 минут","Чтение · 10 минут","Письмо · 8 минут","Говорение · 7 минут","Грамматика и слова · 5 минут"].map(x=>`<div class="item"><input type="checkbox" class="check"><div class="grow">${x}</div></div>`).join("")}<p class="small">Отмечай выполненное. Даже 10 минут — лучше, чем ждать идеального часа.</p></div>`}
function saveVocab(){let w=$("#vWord").value.trim();if(w){data.vocab.push({word:w,translation:$("#vTrans").value,emoji:$("#vEmoji").value||"✨",example:$("#vExample").value});save();langTab("vocab",document.querySelectorAll("#page .tabs button")[1])}}
function reviewCard(){let v=data.vocab[Math.floor(Math.random()*data.vocab.length)];$("#reviewArea").innerHTML=v?`<div class="card" style="margin-top:12px;background:#f5f8f1"><div class="word">${v.emoji} ${esc(v.word)}</div><button class="btn soft tiny" onclick="this.nextElementSibling.classList.toggle('hidden')">Показать перевод</button><p class="hidden">${esc(v.translation)}</p><button class="btn soft tiny" onclick="speak('${esc(v.word)}')">🔊</button></div>`:"Добавь слова в словарь"}
function addBook(){let v=$("#bookTitle").value.trim();if(v){data.books.push({title:v,status:$("#bookStatus").value,why:$("#bookWhy").value});save();go("books")}}
function addQuote(){let v=$("#quoteText").value.trim();if(v){data.quotes.push({text:v,source:$("#quoteSource").value});save();go("books")}}
function addIdea(){let v=$("#ideaInput").value.trim();if(v){data.ideas.push(v);save();go("ideas")}}
function addCraft(){let v=$("#craftTitle").value.trim();if(v){data.craft.push({title:v,type:$("#craftType").value,status:$("#craftStatus").value,note:$("#craftNote").value});save();go("craft")}}
function addRecipe(){let v=$("#recipeTitle").value.trim();if(v){data.recipes.push({title:v,note:$("#recipeNote").value});save();go("recipes")}}
function addContent(){let v=$("#contentTitle").value.trim();if(v){data.content.push({title:v,platform:$("#contentPlatform").value,date:$("#contentDate").value,note:$("#contentNote").value});save();go("content")}}
function addPhotoUrl(){let src=$("#photoUrl").value.trim();if(src){data.photos.push({src,caption:$("#photoCaption").value});save();go("travel")}}
function uploadPhoto(e){let f=e.target.files[0];if(!f)return;if(f.size>1200000)return toast("Фото больше 1,2 МБ. Выбери файл поменьше.");let r=new FileReader();r.onload=()=>{data.photos.push({src:r.result,caption:$("#photoCaption").value});save();go("travel")};r.readAsDataURL(f)}
function saveTravel(){data.travel.goal=Math.max(1,+$("#travelGoal").value||50000);data.travel.saved=Math.max(0,data.travel.saved+(+$("#travelAdd").value||0));save();go("travel")}
function saveTravelNotes(){data.travel.notes=$("#travelNotes").value;save();toast("Заметки сохранены")}
function removeFrom(key,i){data[key].splice(i,1);save();render()}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="lisa-backup-"+today()+".json";a.click();URL.revokeObjectURL(a.href);toast("Резервная копия скачивается")}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||typeof x!=="object")throw 0;data={...structuredClone(defaultData),...x};save();render();toast("Данные восстановлены")}catch(err){toast("Не удалось прочитать файл резервной копии")}};r.readAsText(f)}
render();
</script></body></html>
